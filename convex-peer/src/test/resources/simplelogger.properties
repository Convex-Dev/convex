# SLF4J Simple Logger configuration for tests
# Suppress INFO noise, show WARN and above

# Default logging level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=warn

# Suppress noisy libraries
org.slf4j.simpleLogger.log.io.javalin=warn
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.convex.peer.Server=warn
org.slf4j.simpleLogger.log.convex.peer.ConnectionManager=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.convex.gui=warn

# Persistence tests deliberately inject IO failures; the background propagator
# logs these at WARN (correct in production, expected noise in tests)
org.slf4j.simpleLogger.log.convex.node.LatticePropagator=error

# Upgrade tests deliberately run peers across unsupported protocol activations;
# upgrade lifecycle alerts (UPGRADE REQUIRED, stake withdrawal, consensus HALTED)
# are correct in production but expected noise in tests
org.slf4j.simpleLogger.log.convex.peer.upgrade=off

# NodeServer robustness tests deliberately send hostile inbound messages
# (wrong type, oversized, failing merges); rejection warnings are correct in
# production but expected noise in tests
org.slf4j.simpleLogger.log.convex.node.NodeServer=error

# Connection-limit tests deliberately exceed the configured cap (#482); the
# rejection warning is correct in production but expected noise in tests
org.slf4j.simpleLogger.log.convex.net.impl.netty.NettyServer=error

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showThreadName=true
