# Keep routine node startup and lifecycle information out of test output.
org.slf4j.simpleLogger.defaultLogLevel=warn

# P2PSocialSyncTest deliberately breaks one filtered propagation view to prove
# that the remaining groups continue independently.
org.slf4j.simpleLogger.log.convex.node.NodeServer=error

org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showThreadName=true
