# .github/workflows/build.yml
# Runs on pushes and pull requests (including from forks) — builds and tests the project
name: Build

on: [push, pull_request]

# Cancel superseded in-progress runs for the same ref (saves CI minutes on rapid re-pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean install

      # Sources and Javadocs are attached only under the release profile. Verify
      # them on the release JDK so ordinary green builds cannot hide publishing
      # failures. Tests have already run above on both supported JDKs.
      - name: Verify release artifacts
        if: matrix.java == '25'
        run: ./mvnw -B -Prelease -DskipTests package
