# .github/workflows/docker.yml
# Manually builds and pushes a Docker image to Docker Hub, for a release tag or
# a snapshot. Releases do not publish images: BUILD.md (release step 10) runs
# this from the release tag with `latest` ticked.
#
# Do NOT add a `release: [published]` trigger here: releases created with the
# workflow GITHUB_TOKEN do not fire workflow events, so it would never run.
name: Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'snapshot'
      latest:
        description: 'Also push the same image as latest'
        type: boolean
        default: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Inputs reach the shell as variables, never interpolated into the script
    env:
      IMAGE: convexlive/convex
      TAG: ${{ inputs.tag }}
      LATEST: ${{ inputs.latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$IMAGE:$TAG" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
