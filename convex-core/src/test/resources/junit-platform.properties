junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.executor-service = WORKER_THREAD_POOL
# Isolate mutable fixtures per test and allow the concurrent default to apply.
# Classes with deliberately shared setup declare @TestInstance(PER_CLASS) explicitly.
junit.jupiter.testinstance.lifecycle.default = per_method
# Quickcheck and remaining JUnit 4 classes share the same JVM and disk fixtures.
junit.vintage.execution.parallel.enabled = true
junit.vintage.execution.parallel.classes = true
# Vintage is intentional for quickcheck; omit its repeated deprecation notice.
junit.vintage.discovery.issue.reporting.enabled = false
